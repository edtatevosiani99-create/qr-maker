name: Build Android APK
# QR Studio release build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create platform files
        run: flutter create --platforms=android .

      - name: Install QR Studio Android activity
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/qr_studio
          cp MainActivity.kt android/app/src/main/kotlin/com/example/qr_studio/MainActivity.kt
          sed -i '/<manifest /a\\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-android
          path: build/app/outputs/flutter-apk/app-release.apk
