name: QR Studio Clean Test APK
# Rebuild requested after dark-theme-only UI update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apk-clean.yml'

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --org com.edtatevosiani99 --project-name qrstudioapp --platforms=android .
      - name: Install QR Studio activity and permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("MainActivity.kt").read_text()
          activity = activity.replace("package com.example.qr_studio", "package com.edtatevosiani99.qrstudioapp")
          Path("android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp/MainActivity.kt").write_text(activity)
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pos = s.find(">", s.find("<manifest"))
          for permission in [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]:
              name = permission.split('"')[1]
              if name not in s:
                  s = s[:pos + 1] + chr(10) + permission + s[pos + 1:]
                  pos = s.find(">", s.find("<manifest"))
          app_meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_meta + chr(10) + "    </application>")
          if "com.google.android.gms.permission.AD_ID" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos + 1] + chr(10) + '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' + s[pos + 1:]
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Prepare and verify original Play signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ACTUAL_SHA1="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="9E:39:03:4A:AA:F4:D0:BF:F2:40:10:31:9E:33:25:D4:34:8C:74:06"
          echo "Verified signing certificate SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key does not match the Google Play upload certificate. Build stopped."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - name: Configure application ID and release signing
        run: python3 .github/scripts/configure-play-store.py
      - name: Build optimized test APK
        run: flutter build apk --release --split-per-abi
      - name: Upload optimized test APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-arm64-split-test-apk-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
