name: QR Studio Clean Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apk-clean.yml'

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --org com.edtatevosiani99 --project-name qrstudioapp --platforms=android .
      - name: Install QR Studio activity and permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("MainActivity.kt").read_text()
          activity = activity.replace("package com.example.qr_studio", "package com.edtatevosiani99.qrstudioapp")
          Path("android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp/MainActivity.kt").write_text(activity)
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pos = s.find(">", s.find("<manifest"))
          for permission in [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]:
              name = permission.split('"')[1]
              if name not in s:
                  s = s[:pos + 1] + chr(10) + permission + s[pos + 1:]
                  pos = s.find(">", s.find("<manifest"))
          app_meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_meta + chr(10) + "    </application>")
          if "com.google.android.gms.permission.AD_ID" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos + 1] + chr(10) + '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' + s[pos + 1:]
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Configure temporary test signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          marker = "    release {"
          if marker not in s:
              raise SystemExit("Release build type not found")
          start = s.index(marker) + len(marker)
          if "signingConfig = signingConfigs.getByName(\"debug\")" not in s:
              s = s[:start] + '\n        signingConfig = signingConfigs.getByName("debug")' + s[start:]
          p.write_text(s)
          PY
      - name: Build optimized test APK
        run: flutter build apk --release --split-per-abi
      - name: Upload optimized test APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-arm64-split-test-apk-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
