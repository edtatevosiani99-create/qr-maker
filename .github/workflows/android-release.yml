name: QR Studio Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'app_icon.png'
      - 'MainActivity.kt'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate Android project with Play Store application ID
        run: flutter create --org com.edtatevosiani99 --project-name qrstudioapp --platforms=android .

      - name: Install QR Studio activity and notification permission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp
          sed 's/^package com\.example\.qr_studio$/package com.edtatevosiani99.qrstudioapp/' MainActivity.kt > android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          pos = s.find(">", s.find("<manifest"))
          additions = []
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in s:
                  additions.append(permission)
          if additions:
              s = s[:pos + 1] + "\n" + "\n".join(additions) + s[pos + 1:]
          # QR Studio's configured AdMob application ID.
          app_meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_meta + "\n    </application>")
          p.write_text(s)
          PY

      - name: Prepare and verify original Play signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ACTUAL_SHA1="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="9E:39:03:4A:AA:F4:D0:BF:F2:40:10:31:9E:33:25:D4:34:8C:74:06"
          echo "Verified signing certificate SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key does not match the Google Play upload certificate."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Configure application ID and release signing
        run: python3 .github/scripts/configure-play-store.py

      - name: Disable broken dependency lint analysis for release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "checkReleaseBuilds = false" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Android block not found")
              s = s.replace(marker, marker + '\\n    lint {\\n        checkReleaseBuilds = false\\n    }', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Build signed Play Store AAB
        run: flutter build appbundle --release

      - name: Verify bundle application ID
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          echo "AAB exists and has a verifiable signature."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload signing key backup - save securely for future updates
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-signing-backup
          path: qr-studio-signing-backup.zip
          if-no-files-found: error
          retention-days: 90
