name: Build QR Studio Play Store AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/play-store-aab.yml'
      - '.github/scripts/configure-play-store.py'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'app_icon.png'
      - 'MainActivity.kt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android project with confirmed application ID
        run: flutter create --org com.edtatevosiani99 --project-name qrstudioapp --platforms=android .

      - name: Install QR Studio activity
        run: |
          mkdir -p android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp
          sed 's/^package com\.example\.qr_studio/package com.edtatevosiani99.qrstudioapp/' MainActivity.kt > android/app/src/main/kotlin/com/edtatevosiani99/qrstudioapp/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.POST_NOTIFICATIONS" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos + 1] + '\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' + s[pos + 1:]
          app_meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_meta + "\\n    </application>")
          p.write_text(s)
          PY

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            KEY_ALIAS_VALUE="$ANDROID_KEY_ALIAS"
          else
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"
            KEY_ALIAS_VALUE="qrstudio-upload"
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS_VALUE" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=QR Studio, OU=Mobile, O=QR Studio, L=Berlin, ST=Berlin, C=DE"
            mkdir -p signing-backup
            cp android/app/upload-keystore.jks signing-backup/upload-keystore.jks
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' "$STORE_PASS" "$KEY_ALIAS_VALUE" "$KEY_PASS" > signing-backup/credentials.txt
            (cd signing-backup && zip -q ../qr-studio-signing-backup.zip upload-keystore.jks credentials.txt)
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS_VALUE" > android/key.properties

      - name: Configure application ID and release signing
        run: python3 .github/scripts/configure-play-store.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload signing backup for safekeeping
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-signing-backup
          path: qr-studio-signing-backup.zip
          if-no-files-found: ignore
          retention-days: 90
