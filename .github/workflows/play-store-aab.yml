name: Build QR Studio Play Store AAB
# Rebuild signed Play Store bundle when this workflow is updated.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/play-store-aab.yml'
      - '.github/scripts/configure-play-store.py'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'app_icon.png'
      - 'MainActivity.kt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android project with confirmed application ID
        run: flutter create --org com.edtatevosiani --project-name qrstudioapp --platforms=android .

      - name: Install QR Studio activity
        run: |
          mkdir -p android/app/src/main/kotlin/com/edtatevosiani/qrstudioapp
          python3 - <<'PY'
          from pathlib import Path
          src = Path("MainActivity.kt").read_text()
          src = src.replace("package com.example.qr_studio", "package com.edtatevosiani.qrstudioapp", 1)
          src = src.replace("R.mipmap.ic_launcher", "android.R.drawable.ic_menu_view")
          Path("android/app/src/main/kotlin/com/edtatevosiani/qrstudioapp/MainActivity.kt").write_text(src)
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "com.google.android.gms.permission.AD_ID" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos + 1] + '\\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' + s[pos + 1:]
          if "android.permission.POST_NOTIFICATIONS" not in s:
              pos = s.find(">", s.find("<manifest"))
              s = s[:pos + 1] + '\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' + s[pos + 1:]
          app_meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_meta + "\\n    </application>")
          p.write_text(s)
          PY

      - name: Prepare and verify original Play signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
          KEY_PASS="$ANDROID_KEY_PASSWORD"
          KEY_ALIAS_VALUE="$ANDROID_KEY_ALIAS"
          ACTUAL_SHA1="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS_VALUE" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="9E:39:03:4A:AA:F4:D0:BF:F2:40:10:31:9E:33:25:D4:34:8C:74:06"
          echo "Verified signing certificate SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key does not match the certificate expected by Google Play. Build stopped."
            exit 1
          fi
          printf 'storePassword=%s\\nkeyPassword=%s\\nkeyAlias=%s\\nstoreFile=upload-keystore.jks\\n' "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS_VALUE" > android/key.properties

      - name: Configure application ID and release signing
        run: python3 .github/scripts/configure-play-store.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
