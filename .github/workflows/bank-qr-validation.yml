name: Validate QR Studio Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/bank-qr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: flutter create --platforms=android --org com.edtatevosiani99 --project-name qrstudioapp .
      - name: Configure Android manifest for QR Studio plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          manifest_end = s.find(">", s.find("<manifest"))
          additions = []
          for permission in (
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ):
              name = permission.split('"')[1]
              if name not in s:
                  additions.append(permission)
          if additions:
              s = s[:manifest_end + 1] + "\n" + "\n".join(additions) + s[manifest_end + 1:]
          app_id = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_id + "\n    </application>")
          p.write_text(s)
          if "ca-app-pub-3904535066175358~4536494382" not in s:
              raise SystemExit("AdMob application ID was not added to AndroidManifest.xml")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-bank-qr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
