name: Validate QR Studio Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/bank-qr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: flutter create --platforms=android --org com.edtatevosiani99 --project-name qrstudioapp .
      - name: Configure Android manifest for QR Studio plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          manifest_end = s.find(">", s.find("<manifest"))
          additions = []
          for permission in (
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ):
              name = permission.split('"')[1]
              if name not in s:
                  additions.append(permission)
          if additions:
              s = s[:manifest_end + 1] + "\n" + "\n".join(additions) + s[manifest_end + 1:]
          app_id = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3904535066175358~4536494382" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", app_id + "\n    </application>")
          p.write_text(s)
          if "ca-app-pub-3904535066175358~4536494382" not in s:
              raise SystemExit("AdMob application ID was not added to AndroidManifest.xml")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build ABI-specific debug APKs
        run: flutter build apk --debug --split-per-abi
      - name: Smoke-test app launch on Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            adb install build/app/outputs/flutter-apk/app-x86_64-debug.apk
            adb shell am force-stop com.edtatevosiani99.qrstudioapp
            adb shell monkey -p com.edtatevosiani99.qrstudioapp 1
            sleep 12
            if ! adb shell pidof com.edtatevosiani99.qrstudioapp; then
              adb logcat -d -t 1500
              echo "QR Studio process exited after launch."
              exit 1
            fi
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-bank-qr-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
